<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e5a"/></marker>
  <style>
    text { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .lane { font-size: 19px; font-weight: 700; fill: #1f2a33; }
    .node-b { font-size: 18px; font-weight: 700; fill: #17323b; }
    .node { font-size: 15px; fill: #2c3e46; }
    .edge { font-size: 14px; font-weight: 600; }
  </style>
</defs>
<rect width="1100" height="800" fill="#ffffff"/>
<rect x="20" y="10" width="1060" height="230" rx="14" fill="#fdf8e6" stroke="#c9d3dc" stroke-width="1.5"/>
<text x="40" y="40" class="lane">1. Preparation — before the session</text>
<rect x="20" y="256" width="1060" height="262" rx="14" fill="#eef4fb" stroke="#c9d3dc" stroke-width="1.5"/>
<text x="40" y="286" class="lane">2. Real-time — during the answer</text>
<rect x="20" y="534" width="1060" height="246" rx="14" fill="#eef8f0" stroke="#c9d3dc" stroke-width="1.5"/>
<text x="40" y="564" class="lane">3. Post-session — reporting and review</text>
<text x="45" y="718" class="edge" fill="#555">Solid: execution   Dashed: review feedback   Red: interruption   Orange: end of answer   Green: logging</text>
<rect x="45" y="60" width="185" height="90" rx="10" fill="#ffffff" stroke="#1f4e5a" stroke-width="2"/>
