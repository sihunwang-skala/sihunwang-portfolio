<text x="305.0" y="355.0" text-anchor="middle" class="node-b">Silero VAD</text>
<text x="305.0" y="377.0" text-anchor="middle" class="node">Speech detection</text>
<rect x="415" y="330" width="180" height="60" rx="10" fill="#ffffff" stroke="#1f4e5a" stroke-width="2"/>
<text x="505.0" y="355.0" text-anchor="middle" class="node-b">faster-whisper</text>
<text x="505.0" y="377.0" text-anchor="middle" class="node">Transcription (STT)</text>
